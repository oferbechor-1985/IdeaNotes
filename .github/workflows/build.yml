name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Prepare signing key
        env:
          KS: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KS" ]; then
            echo "::error::Missing GitHub secret KEYSTORE_BASE64"
            exit 1
          fi
          echo "$KS" | base64 -d > "$RUNNER_TEMP/ideanotes.jks"
          echo "KEYSTORE_PATH=$RUNNER_TEMP/ideanotes.jks" >> "$GITHUB_ENV"

      - name: Build signed release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: gradle assembleRelease -PappVersionCode=${{ github.run_number }} --no-daemon

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk IdeaNotes.apk
          git log -1 --pretty=%s > notes.txt
          gh release create "build-${{ github.run_number }}" IdeaNotes.apk \
            --title "גרסה ${{ github.run_number }}" \
            --notes-file notes.txt
